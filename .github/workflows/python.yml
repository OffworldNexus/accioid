name: Python

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, lint, type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: ruff format --check
        run: uv run --frozen ruff format --check .
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: mypy
        run: uv run --frozen mypy custom_components/accioid

  test:
    name: Unit + BDD tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: pytest
        run: uv run --frozen pytest --junitxml=test-results/pytest.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
          retention-days: 7

  validate:
    name: Config, scripts, frontend, packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies without changing the lockfile
        run: uv sync --locked
      - name: Validate YAML, JSON, TOML and HA/HACS metadata
        run: uv run --frozen scripts/ci_validate.py
      - name: Shell syntax and ShellCheck
        run: |
          command -v shellcheck
          for script in scripts/*.sh; do
            bash -n "$script"
            shellcheck "$script"
          done
      - name: Frontend JavaScript syntax
        run: |
          find custom_components/accioid/frontend -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check
      - name: Validate Docker Compose config without starting containers
        env:
          ACCIOID_HA_CONFIG: /tmp/accioid-ci-config
        run: docker compose -f scripts/ha-dev.compose.yml config --quiet
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - name: Verify integration assets in both distributions
        run: uv run --frozen scripts/ci_validate.py --dist dist
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
